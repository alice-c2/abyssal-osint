<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Abyssal — Dashboard</title>
<link rel="icon" href="assets/logo-red.png">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: { 50:'#fef2f2',100:'#fee2e2',200:'#fecaca',300:'#fca5a5',400:'#f87171',500:'#ef4444',600:'#dc2626',700:'#b91c1c',800:'#991b1b',900:'#7f1d1d'},
          secondary: { 50:'#fff1f2',100:'#ffe4e6',200:'#fecdd3',300:'#fda4af',400:'#fb7185',500:'#f43f5e',600:'#e11d48',700:'#be123c'},
        },
        fontFamily: { sans: ['Poppins','sans-serif'] }
      }
    }
  }
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-black text-white h-screen overflow-hidden">

<canvas id="particles-bg"></canvas>
<div id="mouse-glow"></div>

<div class="flex h-full relative z-10">

  <!-- ============ SIDEBAR ============ -->
  <aside id="sidebar" class="shrink-0 h-full border-r border-white/10 flex flex-col bg-black/70 backdrop-blur-sm">
    <div class="flex items-center justify-between px-5 pt-5 pb-4">
      <a href="index.html" class="flex items-center gap-2.5 overflow-hidden">
        <img src="assets/logo-red.png" alt="Abyssal" class="w-7 h-7 object-contain shrink-0 drop-shadow-[0_0_10px_rgba(220,38,38,0.6)]">
        <span class="logo-text text-lg font-semibold whitespace-nowrap">Abyssal</span>
      </a>
      <button id="collapseBtn" class="p-1.5 rounded-md text-gray-500 hover:text-white hover:bg-white/5 shrink-0">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
    </div>

    <div class="px-4 mb-2">
      <div id="sideSearch-wrap" class="relative">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="sideSearch" type="text" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" placeholder="Search..." class="w-full bg-white/[0.03] border border-white/10 rounded-lg pl-9 pr-14 py-2 text-sm placeholder-gray-500 outline-none focus:border-primary-400/40">
        <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] text-gray-500 border border-white/10 rounded px-1.5 py-0.5">Ctrl K</span>
      </div>
    </div>

    <nav id="navList" class="flex-1 overflow-y-auto dash-scroll px-4 pb-4"></nav>

    <div class="border-t border-white/10 px-4 pt-4 pb-3">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-primary-600 flex items-center justify-center text-sm font-semibold shrink-0">I</div>
        <div class="user-meta flex-1 min-w-0">
          <p class="text-sm truncate">Investigator</p>
          <p class="text-[11px] text-gray-500 truncate">Account settings</p>
        </div>
        <button class="text-gray-500 hover:text-white shrink-0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main id="mainPanel" class="flex-1 h-full overflow-y-auto dash-scroll bg-black/40"></main>

</div>

<script src="js/particles.js"></script>
<script src="js/live-tools.js"></script>
<script src="js/alice-chat.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
